iac_templates:
  ansible: "\n---\n- name: Deploy AI-Optimized Infrastructure\n  hosts: all\n  become:\
    \ yes\n  tasks:\n    - name: Install Docker\n      apt:\n        name: docker.io\n\
    \        state: present\n        \n    - name: Deploy application\n      docker_container:\n\
    \        name: app\n        image: nginx:latest\n        state: started\n    \
    \    restart_policy: always\n        ports:\n          - \"80:80\"\n"
  cdk: "\nfrom aws_cdk import (\n    Stack,\n    aws_ec2 as ec2,\n    aws_ecs as ecs,\n\
    \    aws_ecs_patterns as ecs_patterns,\n)\n\nclass AIOptimizedStack(Stack):\n\
    \    def __init__(self, scope, id, **kwargs):\n        super().__init__(scope,\
    \ id, **kwargs)\n        \n        vpc = ec2.Vpc(self, \"VPC\", max_azs=3)\n \
    \       cluster = ecs.Cluster(self, \"Cluster\", vpc=vpc)\n        \n        ecs_patterns.ApplicationLoadBalancedFargateService(\n\
    \            self, \"Service\",\n            cluster=cluster,\n            cpu=256,\n\
    \            memory_limit_mib=512,\n            desired_count=3\n        )\n"
  kubernetes: "\n# AI-Generated Kubernetes manifests with sustainability hints\napiVersion:\
    \ apps/v1\nkind: Deployment\nmetadata:\n  name: ai-optimized-app\n  annotations:\n\
    \    carbon-aware-scheduling: \"enabled\"\n    preferred-renewable-regions: \"\
    us-west-2,eu-west-1\"\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n \
    \     app: ai-optimized\n  template:\n    metadata:\n      labels:\n        app:\
    \ ai-optimized\n    spec:\n      containers:\n      - name: app\n        image:\
    \ nginx:latest\n        resources:\n          requests:\n            cpu: \"500m\"\
    \n            memory: \"512Mi\"\n          limits:\n            cpu: \"1000m\"\
    \n            memory: \"1Gi\"\n        env:\n        - name: AI_OPTIMIZED\n  \
    \        value: \"true\"\n        "
  terraform: "\n# AI-Generated Terraform for Multi-AZ Active-Active\n# Generated:\
    \ 2025-12-11T14:13:03.207093\n\nmodule \"compute\" {\n  source = \"terraform-aws-modules/ec2-instance/aws\"\
    \n  \n  instance_type = \"c6i.4xlarge\"\n  instance_count = 4\n  \n  tags = {\n\
    \    Environment = \"production\"\n    AI_Designed = \"true\"\n    Compliance\
    \ = \"validated\"\n  }\n}\n\n# AI-Added: Auto-scaling based on carbon intensity\n\
    resource \"aws_autoscaling_policy\" \"carbon_aware\" {\n  name = \"carbon-aware-scaling\"\
    \n  scaling_adjustment = 2\n  adjustment_type = \"ChangeInCapacity\"\n  cooldown\
    \ = 300\n  \n  metric_aggregation_type = \"Average\"\n  metric_interval_lower_bound\
    \ = \"0\"\n  target_value = \"${var.carbon_intensity_threshold}\"\n}\n        "
